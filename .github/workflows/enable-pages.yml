name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.urls.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages from main root
        id: enable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages already enabled"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f "source[branch]=main" -f "source[path]=/" \
              >/tmp/pages-update.json 2>/tmp/pages-update.err || true
          else
            echo "Creating Pages site from main /"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              --input - >/tmp/pages.json 2>/tmp/pages.err <<'EOF'
          {
            "build_type": "legacy",
            "source": {
              "branch": "main",
              "path": "/"
            }
          }
          EOF
            create_status=$?
            if [ "$create_status" -ne 0 ]; then
              echo "Legacy source enable failed; trying workflow build type"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
                -f build_type=workflow \
                >/tmp/pages.json 2>/tmp/pages.err || true
            fi
          fi
          echo "=== pages API ==="
          cat /tmp/pages.json || true
          echo
          cat /tmp/pages.err || true
          gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages-now.json 2>/tmp/pages-now.err
          if [ $? -eq 0 ]; then
            echo "pages_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/pages-now.json || true

      - name: Configure Pages
        if: steps.enable.outputs.pages_enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Stage static files
        if: steps.enable.outputs.pages_enabled == 'true'
        run: |
          mkdir -p publish
          cp index.html privacy.html publish/
          touch publish/.nojekyll

      - name: Upload static files
        if: steps.enable.outputs.pages_enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        if: steps.enable.outputs.pages_enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record URL
        id: urls
        if: steps.enable.outputs.pages_enabled == 'true'
        run: echo "page_url=${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_OUTPUT"
